{% extends "base.html" %}
{% block title %}Events{% endblock %}
{% block body %}
<h1>Events</h1>
<p>Read-only view of the last 500 events of the SANDMAN stream (ephemeral ordered consumer, no acknowledgements).</p>
<form method="get" action="/events" class="filters">
  <label>Type
    <select name="type">
      <option value="">any</option>
      {% for t in types %}<option value="{{ t }}" {% if t == type_ %}selected{% endif %}>{{ t }}</option>{% endfor %}
    </select>
  </label>
  <label>Project
    <select name="project">
      <option value="">any</option>
      {% for p in projects %}<option value="{{ p }}" {% if p == project %}selected{% endif %}>{{ p }}</option>{% endfor %}
    </select>
  </label>
  <button>Filter</button>
</form>
<div id="events" hx-get="/fragments/events?{{ {'type': type_, 'project': project} | urlencode }}" hx-trigger="every 5s" hx-swap="innerHTML">
{% include "_events.html" %}
</div>
{% endblock %}
