[project]
name = "sandman"
version = "0.1.0"
description = "SANDMAN workspace root (not a package)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "sandman-agent",
  "sandman-orchestrator",
  "sandman-extraction-agent",
  "sandman-document-converter",
  "sandman-query-service",
  "sandman-dashboard",
  "sandman-llm-replay",
  "sandman-cli",
  "sandman-plugin-stubs",
]

[tool.uv]
package = false
# no OCR/GUI: the headless wheel avoids libgl/libxcb in the document-converter image
override-dependencies = ["opencv-python; sys_platform == 'never'", "opencv-python-headless>=4.6"]

[tool.uv.sources]
sandman-agent = { workspace = true }
sandman-orchestrator = { workspace = true }
sandman-extraction-agent = { workspace = true }
sandman-document-converter = { workspace = true }
sandman-query-service = { workspace = true }
sandman-dashboard = { workspace = true }
sandman-llm-replay = { workspace = true }
sandman-cli = { workspace = true }
sandman-plugin-stubs = { workspace = true }

[tool.uv.workspace]
members = [
  "libs/python/*",
  "services/orchestrator",
  "services/extraction-agent",
  "services/document-converter",
  "services/query-service",
  "services/dashboard",
  "services/llm-replay",
  "tools/cli",
  "tests/plugin-stubs",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
    "types-protobuf>=7.35.1.20260906",
    "pytest-asyncio>=1.4.0",
    { include-group = "contracts" },
]
contracts = [
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "rfc8785==0.1.4",
  "openapi-spec-validator==0.9.0",
  "pyyaml==6.0.3",
]


[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["spikes"]  # throwaway spike scripts

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running performance checks",
  "docling: needs the prefetched Docling models (python -m sandman_document_converter.prefetch); deselect with -m 'not docling'",
]
pythonpath = ["scripts"]
testpaths = ["libs/python", "services", "tools", "tests/plugin-stubs", "tests/conformance", "scripts"]
