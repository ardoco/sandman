- id: nl-ms-018
  project: mediastore
  question: Which components without documentation exist?
  strategy: cypher
  author: ai-draft
  split: dev
  cypher: 'MATCH (:Artifact)-[:CURRENT_VERSION]->(:ArtifactVersion)-[:HAS_ELEMENT]->(c:ModelElement {projectId: $projectId, kind: ''component''})
    OPTIONAL MATCH (l:TraceLink {projectId: $projectId, active: true, linkType: ''documents''})-[:SOURCE|TARGET]->(c) WITH c, count(l) AS docs
    WHERE docs = 0 RETURN c.key AS key, c.name AS name ORDER BY key'
