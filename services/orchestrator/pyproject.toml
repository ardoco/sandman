[project]
name = "sandman-orchestrator"
version = "0.1.0"
description = "Rule-based orchestrator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2",
    "rfc8785>=0.1.4",
    "sandman-agent",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandman_orchestrator"

[tool.uv.sources]
sandman-agent = { workspace = true }

[tool.mutmut]
source_paths = ["src/sandman_orchestrator/rules.py"]
also_copy = ["tests", "src"]
pytest_add_cli_args = ["-o", "asyncio_mode=auto", "--import-mode=importlib", "--deselect", "tests/test_rules.py::test_shipped_rules_link_a_changed_code_version_to_the_documents_without_an_approaches_list", "--deselect", "tests/test_rules.py::test_retention_loaded_from_repository_config"]
pytest_add_cli_args_test_selection = ["tests/test_rules.py", "tests/test_rules_unit.py"]
