routes:
  chat-default: openrouter/openai/gpt-4o-mini        # cloud: needs OPENROUTER_API_KEY in deploy/secrets/gateway.env
  chat-alt: openrouter/anthropic/claude-3.5-haiku    # cloud: needs OPENROUTER_API_KEY
  embed-default: openai/text-embedding-3-small       # cloud: needs OPENAI_API_KEY
  chat-local: ollama/qwen3:4b                        # self-hosted (Apache-2.0)
  embed-local: ollama/nomic-embed-text:v1.5          # self-hosted (Apache-2.0)

openrouterProviders:                                 # pinned upstream provider per openrouter/ model; llm-replay sends provider.order and allow_fallbacks=false (R-041)
  openai/gpt-4o-mini: openai
  anthropic/claude-3.5-haiku: anthropic
