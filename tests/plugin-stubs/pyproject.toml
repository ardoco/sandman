[project]
name = "sandman-plugin-stubs"
version = "0.1.0"
description = "Plugin stubs for the walking skeleton."
requires-python = ">=3.13,<3.14"
dependencies = ["sandman-agent"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandman_plugin_stubs"

[tool.uv.sources]
sandman-agent = { workspace = true }
