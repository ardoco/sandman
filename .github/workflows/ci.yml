name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/**'
              - '.github/workflows/**'
            python:
              - 'contracts/**'
              - 'libs/python/**'
              - 'services/orchestrator/**'
              - 'services/extraction-agent/**'
              - 'services/document-converter/**'
              - 'services/query-service/**'
              - 'services/dashboard/**'
              - 'services/llm-replay/**'
              - 'tools/**'
              - 'tests/plugin-stubs/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            java:
              - 'contracts/**'
              - 'libs/java/**'
              - 'services/tlr-agent/**'
              - 'services/inconsistency-agent/**'
              - 'pom.xml'
              - '.github/workflows/**'
            compose:
              - 'deploy/**'
              - 'services/**'
              - 'libs/**'
              - 'contracts/**'
              - 'config/**'
              - 'tools/**'
              - 'tests/plugin-stubs/**'
              - 'tests/e2e/**'
              - 'pom.xml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/validate_contracts.py

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: make lint
      - uses: actions/cache@v6
        with:
          path: ~/.cache/sandman-models
          key: docling-models-${{ hashFiles('services/document-converter/src/sandman_document_converter/prefetch.py') }}  # pinned revisions and sha256
      - run: uv run python -m sandman_document_converter.prefetch
      - run: uv run pytest

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config with generated secrets
        run: |
          tmp=$(mktemp -d)
          cp -R deploy "$tmp/deploy"
          cd "$tmp/deploy"
          ./gen-secrets.sh > /dev/null
          for profiles in "" "--profile stubs --profile obs" "--profile dashboard --profile resources" "--profile corenlp-local"; do
            docker compose $profiles config -q
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: build images, start the stack, wait for health
        env:
          SANDMAN_CORENLP_MODE: local   # no CoreNLP credentials in CI
        run: |
          deploy/gen-secrets.sh > /dev/null
          deploy/check-env.sh
          docker compose -f deploy/docker-compose.yml --profile stubs --profile corenlp-local up -d --build --wait --wait-timeout 300
      - name: logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile stubs --profile corenlp-local logs --no-color --tail 200
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --profile stubs --profile corenlp-local down -v

  e2e:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.compose == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: e2e (strict replay from tests/cassettes, no provider keys)
        run: make e2e
      - name: logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile stubs --profile corenlp-local logs --no-color --tail 300
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --profile stubs --profile corenlp-local down -v
