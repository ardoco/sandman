openapi: 3.1.0
info:
  title: SANDMAN shared OpenAPI components
  version: 0.6.0
  description: |
    Components referenced by the service OpenAPI documents. Not a service itself.
    Operations marked x-sandman-status: planned are part of the final contract but answer 501 with the NotImplemented problem body until implemented (R-019). Operations marked x-sandman-status: out-of-scope-M0 exist only on the owner service and are not forwarded by the query-service in M0 (R-007).
paths: {}
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: SANDMAN service token. Each service holds only its own token (secret svc_token_<name>); receivers map it to a caller name via the hash file svc_tokens_verify. Owners call plugins with a per-plugin inbound token (secret plugin_in_<plugin>).
    session:
      type: apiKey
      in: cookie
      name: sandman_session
      description: Signed console session cookie (query-service only).
    personalToken:
      type: http
      scheme: bearer
      description: Personal API token of a user (query-service only), e.g. for CLI/CI.
  parameters:
    Actor:
      name: X-Sandman-Actor
      in: header
      required: false
      description: End-user identity forwarded by the query-service (trusted forwarder). A request carrying it from any other caller is rejected with 403 (R-005).
      schema:
        type: string
        pattern: "^user:[A-Za-z0-9._@-]+$"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "../common.schema.json#/$defs/ProjectId"
    Limit:
      name: limit
      in: query
      description: Page size of the owner list endpoints (maximum 500 in every service). The raw Cypher limit of the query-service is separate (query-service.yaml queryCypher, maximum 1000).
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, examples: ["about:blank"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { type: string }
    ServiceStatus:
      type: object
      description: Activity of a SANDMAN service for the system overview (ADR-0016). Implemented by both agent libraries and llm-replay.
      required: [service, version, state, activeTasks]
      properties:
        service: { type: string, examples: ["tlr-agent"] }
        version: { type: string, description: "image tag + git commit" }
        state:
          enum: [working, idle]
          description: working iff activeTasks > 0.
        activeTasks: { type: integer, minimum: 0, description: "A2A tasks, ingestions or requests in progress." }
        lastActivityAt: { $ref: "../common.schema.json#/$defs/Timestamp" }
        details:
          type: object
          description: "Service-specific, e.g. orchestrator {runningWorkflows, pendingSteps}, llm-replay {mode, experiment, hits, misses, recorded, entries}."
    Health:
      type: object
      required: [status]
      properties:
        status: { enum: [ok, degraded, down] }
        checks:
          type: object
          additionalProperties: { enum: [ok, down] }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State changed concurrently or resource exists
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Dependency unavailable (KG, NATS, gateway)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotImplemented:
      description: Planned operation (x-sandman-status planned); defined in the contract, not implemented yet. Always this body, with type about:blank and title Not Implemented.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  pathItems:
    Status:
      get:
        summary: Activity (working/idle) for the system overview
        operationId: status
        responses:
          "200":
            description: Status
            content:
              application/json:
                schema: { $ref: "#/components/schemas/ServiceStatus" }
          "401": { $ref: "#/components/responses/Unauthorized" }
    Healthz:
      get:
        summary: Liveness
        operationId: healthz
        security: []
        responses:
          "200":
            description: Process alive
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Health" }
    Readyz:
      get:
        summary: Readiness (dependencies reachable)
        operationId: readyz
        security: []
        responses:
          "200":
            description: Ready
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Health" }
          "503":
            description: Not ready
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Health" }
