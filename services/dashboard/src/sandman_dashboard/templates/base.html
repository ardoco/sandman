<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}SANDMAN dashboard{% endblock %}</title>
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
<link rel="stylesheet" href="/static/dashboard.css">
<script src="/static/htmx.min.js"></script>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <strong>SANDMAN dashboard</strong>
  {% if user %}
  <nav>
    <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Services</a>
    <a href="/graph" {% if path == "/graph" %}aria-current="page"{% endif %}>Knowledge graph</a>
    <a href="/gateway" {% if path == "/gateway" %}aria-current="page"{% endif %}>LLM gateway</a>
  </nav>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><span>{{ user }}</span> <button>Log out</button></form>
  {% endif %}
</header>
{% block banner %}{% endblock %}
<main>
{% if message %}<div class="msg {% if error %}error{% endif %}" role="alert">{{ message }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
