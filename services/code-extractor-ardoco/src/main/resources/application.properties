quarkus.application.name=${SANDMAN_SERVICE_NAME:code-extractor-ardoco}
quarkus.http.port=8000
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.json.key-overrides=timestamp=ts,message=msg
quarkus.log.console.json.additional-field."service".value=${SANDMAN_SERVICE_NAME:code-extractor-ardoco}
%test.quarkus.log.console.json.enabled=false
%dev.quarkus.log.console.json.enabled=false
sandman.agent-card=../../contracts/agent-cards/code-extractor-ardoco.json
quarkus.http.limits.max-body-size=32M
