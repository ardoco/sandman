quarkus.application.name=${SANDMAN_SERVICE_NAME:tlr-agent}
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metrics.enabled=true
quarkus.otel.metric.export.interval=15s
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.json.key-overrides=timestamp=ts,message=msg
quarkus.log.console.json.additional-field."service".value=${SANDMAN_SERVICE_NAME:tlr-agent}
%test.quarkus.log.console.json.enabled=false
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.class-loading.parent-first-artifacts=io.github.ardoco:sandman-ardoco-shadow
