apiVersion: 1
groups:
  - orgId: 1
    name: sandman-orchestrator
    folder: SANDMAN
    interval: 1m
    rules:
      - uid: sandman-plan-waiting
        title: Plan waiting for approval too long
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        annotations:
          summary: A plan has waited for approval longer than SANDMAN_PLAN_WAIT_ALERT_MINUTES minutes.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(sandman_orchestrator_plans_oldest_waiting_age_seconds) / 60
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [${SANDMAN_PLAN_WAIT_ALERT_MINUTES}]}
