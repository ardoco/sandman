[project]
name = "sandman-cli"
version = "0.1.0"
description = "sandman command-line interface."
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sandman-agent",
]

[project.scripts]
sandman = "sandman_cli.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandman_cli"

[tool.uv.sources]
sandman-agent = { workspace = true }
