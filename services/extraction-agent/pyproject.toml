[project]
name = "sandman-extraction-agent"
version = "0.1.0"
description = "Information extraction agent."
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "docling==2.135.0",
    "fastapi>=0.142.2",
    "markdown-it-py>=4.2.0",
    "pysbd>=0.3.4",
    "python-multipart>=0.0.32",
    "sandman-agent",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandman_extraction"

[tool.uv.sources]
sandman-agent = { workspace = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
