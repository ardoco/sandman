openapi: 3.1.0
info:
  title: SANDMAN tlr-agent REST API
  version: 0.9.0
  description: |
    Catalog and health. Trace link recovery itself is an A2A skill (contracts/agent-cards/tlr-agent.json).
    Operations marked x-sandman-status: out-of-scope-M0 are not forwarded by the query-service in M0 (R-007);
    x-sandman-status: planned operations answer 501 until implemented (R-019).
servers:
  - url: http://tlr-agent:8080
security:
  - serviceToken: []
paths:
  /healthz:
    $ref: "shared.yaml#/components/pathItems/Healthz"
  /readyz:
    $ref: "shared.yaml#/components/pathItems/Readyz"
  /v1/status:
    $ref: "shared.yaml#/components/pathItems/Status"
  /v1/approaches:
    get:
      summary: Available TLR approaches with versions and supported kind pairs
      operationId: listApproaches
      x-sandman-status: out-of-scope-M0
      responses:
        "200":
          description: Approach catalog
          content:
            application/json:
              schema: { $ref: "../skills.schema.json#/$defs/ListApproachesOutput" }
        "401": { $ref: "shared.yaml#/components/responses/Unauthorized" }
  /v1/links/{linkId}/review:
    parameters:
      - name: linkId
        in: path
        required: true
        schema: { $ref: "../common.schema.json#/$defs/StableId" }
    post:
      summary: Confirm or reject a trace link (user review, sets TraceLink.status)
      operationId: reviewLink
      description: Review applies to the element pair (all active links with the same source and target element, except explicit-reference). Requires X-Sandman-Actor from the query-service (other callers 403). 404 unknown link, 409 inactive or explicit-reference link, 422 reject without reason. Publishes sandman.tracelink.reviewed.
      parameters:
        - $ref: "shared.yaml#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { enum: [confirmed, rejected, candidate] }
                reason: { type: string, maxLength: 2000 }
              additionalProperties: false
      responses:
        "200":
          description: Link updated
          content:
            application/json:
              schema:
                type: object
                required: [id, status, reviewedLinkIds]
                properties:
                  id: { $ref: "../common.schema.json#/$defs/StableId" }
                  status: { $ref: "../common.schema.json#/$defs/LinkStatus" }
                  reviewedLinkIds: { type: array, items: { $ref: "../common.schema.json#/$defs/StableId" } }
        "400": { $ref: "shared.yaml#/components/responses/BadRequest" }
        "403": { $ref: "shared.yaml#/components/responses/Forbidden" }
        "404": { $ref: "shared.yaml#/components/responses/NotFound" }
        "409": { $ref: "shared.yaml#/components/responses/Conflict" }
        "422":
          description: Reject without reason
          content:
            application/problem+json:
              schema: { $ref: "shared.yaml#/components/schemas/Problem" }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
