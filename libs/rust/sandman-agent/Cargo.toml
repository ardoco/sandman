[package]
name = "sandman-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "SANDMAN agent kit for Rust (ADR-0017, TX.3)"

# Pre-1.0 dependencies are pinned with "=" (RK-23). a2a-lf is used only in src/a2a/protocol.rs.
[dependencies]
a2a_lf = { package = "a2a-lf", version = "=0.4.2" }
async-nats = "=0.52.0"
neo4rs = { version = "=0.9.0-rc.11", features = ["json", "unstable-bolt-protocol-impl-v2"] }
opentelemetry = "=0.33.1"
serde_json_canonicalizer = "=0.4.1"
jsonschema = { version = "=0.60.2", default-features = false }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
caseless = "0.2"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
