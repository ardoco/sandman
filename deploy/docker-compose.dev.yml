# Development overlay: exposes infrastructure ports on localhost for debugging and local test runs.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  traverse:
    networks: [internal, edge]
    ports: ["127.0.0.1:7690:7690", "127.0.0.1:7691:7691"]
  nats:
    networks: [internal, edge]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
