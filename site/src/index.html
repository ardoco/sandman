<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANDMAN Architecture Map</title>
<style>
:root{--bg:#f7f8fa;--fg:#1b1f24;--muted:#5b6570;--card:#fff;--line:#c5ccd6;--edge:#7a8594;--accent:#0b5fcc;--sel:#fff3c4;--shadow:0 1px 3px rgba(20,30,50,.15);
--z-access:#2f6fdd;--z-ingest:#1b9a67;--z-analysis:#8a54d6;--z-plugins:#c46b1b;--z-infra:#6b7785;--z-kg:#0e8f9e;--z-llm:#c2386b;--z-libs:#a08400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101419;--fg:#e6e9ed;--muted:#9aa5b1;--card:#1b2128;--line:#3a444f;--edge:#8b97a6;--accent:#6aa9ff;--sel:#5a4a10;--shadow:0 1px 3px rgba(0,0,0,.6);
--z-access:#6a9eff;--z-ingest:#45c690;--z-analysis:#b48cf0;--z-plugins:#e8944a;--z-infra:#9aa5b1;--z-kg:#3cc3d3;--z-llm:#ee6f9c;--z-libs:#d9b92e}}
:root[data-theme=dark]{--bg:#101419;--fg:#e6e9ed;--muted:#9aa5b1;--card:#1b2128;--line:#3a444f;--edge:#8b97a6;--accent:#6aa9ff;--sel:#5a4a10;--shadow:0 1px 3px rgba(0,0,0,.6);
--z-access:#6a9eff;--z-ingest:#45c690;--z-analysis:#b48cf0;--z-plugins:#e8944a;--z-infra:#9aa5b1;--z-kg:#3cc3d3;--z-llm:#ee6f9c;--z-libs:#d9b92e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main,footer{padding:0 16px;max-width:1440px;margin:0 auto}
h1{font-size:1.6rem;line-height:1.25;margin:20px 0 8px;max-width:48rem}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:20px}
.intro p{max-width:60rem;margin:0 0 8px}
.tour{margin:14px 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tour .step{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:3px 12px;cursor:pointer}
.tour .step[aria-current=step]{background:var(--accent);border-color:var(--accent);color:#fff}
.tour .sep{color:var(--muted)}
.tour .nav{font:inherit;font-size:.85rem;border:1px solid var(--line);background:none;color:var(--accent);border-radius:6px;padding:3px 10px;cursor:pointer}
.tour .nav:disabled{opacity:.4;cursor:default}
#tourtext{min-height:3.2em;max-width:60rem;margin:6px 0 4px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--card);border-radius:0 6px 6px 0;color:var(--muted)}
#tourtext b{color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.85rem;margin:10px 0 6px;align-items:center}
.legend svg{vertical-align:middle;margin-right:4px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:24px}
@media (min-width:1000px){main{grid-template-columns:minmax(0,1fr) 320px}aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
#graph{min-width:0}
svg.map{display:block;width:100%;height:auto;margin:0 auto}
.zone rect.bg{fill:color-mix(in srgb,var(--zc) 7%,var(--bg));stroke:color-mix(in srgb,var(--zc) 45%,var(--bg));stroke-width:1.2}
.zone.external rect.bg{stroke-dasharray:6 4}
.zone .ztitle{font-size:13.5px;font-weight:650;fill:var(--fg)}
.zone .zblurb{font-size:10.5px;fill:var(--muted)}
.zone .badge{fill:var(--zc)}
.zone .glyph{fill:#fff;font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node{cursor:pointer;transition:opacity .15s}
.node rect.card{fill:var(--card);stroke:color-mix(in srgb,var(--zc) 55%,var(--card));stroke-width:1.3;filter:drop-shadow(var(--shadow))}
.node .nbadge{fill:color-mix(in srgb,var(--zc) 18%,var(--card))}
.node .nglyph{fill:var(--zc);font-size:12px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node .ntitle{font-size:12px;font-weight:600;fill:var(--fg);pointer-events:none}
.node .nname{font:10px ui-monospace,Menlo,monospace;fill:var(--muted);pointer-events:none}
.node:focus{outline:none}
.node:focus rect.card,.node.sel rect.card{stroke:var(--accent);stroke-width:2.6}
.node.sel rect.card{fill:var(--sel)}
.edge{stroke:var(--edge);stroke-width:1.2;fill:none;opacity:.3;transition:opacity .15s}
.edge.calls{stroke-dasharray:6 4}
.edge.on{stroke:var(--accent);stroke-width:2.2;opacity:1}
.dim{opacity:.2}
.narrow .edge:not(.on){display:none}
marker path{fill:var(--edge)}
marker.on path{fill:var(--accent)}
aside{background:var(--card);border-radius:10px;padding:12px 16px;align-self:start;box-shadow:var(--shadow)}
aside h2{margin:0 0 2px;font-size:1.15rem}
aside h3{font-size:.78rem;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
aside ul{margin:0;padding-left:18px}
aside p{margin:6px 0}
aside .sum{font-weight:600}
aside .close{float:right;font:inherit;border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;display:none}
aside code{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
aside details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
aside summary{cursor:pointer;font-weight:600}
@media (max-width:999px){aside:not(.has){display:none}aside.has{position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:55vh;overflow:auto;border-radius:12px 12px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.3)}aside .close{display:block}body.sheet{padding-bottom:55vh}}
a{color:var(--accent)}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:10px;padding:0 8px;margin:0 4px 4px 0}
button.chip{font:inherit;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;text-align:left}
footer{padding-bottom:40px}
footer h2{font-size:1.2rem;margin:8px 0}
dl.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px 24px;margin:0}
dl.gloss div{background:var(--card);border-radius:8px;padding:8px 12px}
dl.gloss dt{font-weight:650}
dl.gloss dd{margin:2px 0 0;color:var(--muted);font-size:.92rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
<div class="eyebrow">SANDMAN architecture map</div>
<h1 id="h1">SANDMAN</h1>
<div class="intro" id="intro"></div>
<div class="tour" id="tour" role="group" aria-label="Follow the data"></div>
<div id="tourtext" aria-live="polite">Pick a step to follow the data through the system, or click a component to learn what it does.</div>
<div class="legend" aria-label="Legend">
<span><svg width="34" height="10" aria-hidden="true"><line x1="1" y1="5" x2="26" y2="5" stroke="var(--edge)" stroke-width="1.6"/><path d="M33 5l-7-4v8z" fill="var(--edge)"/></svg>needs / starts after</span>
<span><svg width="34" height="10" aria-hidden="true"><line x1="1" y1="5" x2="26" y2="5" stroke="var(--edge)" stroke-width="1.6" stroke-dasharray="5 3"/><path d="M33 5l-7-4v8z" fill="var(--edge)"/></svg>calls over the network</span>
<span><svg width="30" height="14" aria-hidden="true"><rect x="1" y="1" width="28" height="12" rx="4" fill="none" stroke="var(--edge)" stroke-dasharray="4 3"/></svg>outside system</span>
<span>Hover or focus a component to highlight its neighbours.</span>
</div>
</header>
<main>
<div id="graph" aria-label="Component map"></div>
<aside id="panel" aria-live="polite"></aside>
</main>
<footer>
<h2>Glossary</h2>
<dl class="gloss" id="gloss"></dl>
</footer>
<script>
const NS = "http://www.w3.org/2000/svg", NW = 184, NH = 60, GAP = 10, ZP = 12, ZH = 68, COLGAP = 36, ROWGAP = 32, PAD = 8, RIGHT = 36;
let data, byId, zoneOf, selected = null, hover = null, tour = null;
const el = (n, a = {}, t) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; };
const h = (n, a = {}, t) => { const e = document.createElement(n); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; };
const $ = id => document.getElementById(id);

function wrap(text, max, lines = 2) {
  const out = []; let cur = "";
  for (const w of text.split(" ")) { if (cur && (cur + " " + w).length > max) { out.push(cur); cur = w; } else cur = cur ? cur + " " + w : w; }
  out.push(cur);
  if (out.length > lines) { out.length = lines; out[lines - 1] = out[lines - 1].slice(0, max - 1) + "…"; }
  return out;
}

function layout(width) {
  const ncols = width >= 980 ? 4 : width >= 560 ? 2 : 1, ZW = NW + 2 * ZP;
  const zs = data.zones.map((z, i) => {
    const members = data.components.filter(c => c.zone === z.id);
    return { ...z, members, w: ZW, h: ZH + members.length * (NH + GAP) - GAP + ZP, c: ncols === 4 ? z.col : i % ncols, r: ncols === 4 ? z.row : Math.floor(i / ncols) };
  });
  const rows = Math.max(...zs.map(z => z.r)) + 1, rowH = Array(rows).fill(0), rowY = [];
  zs.forEach(z => { rowH[z.r] = Math.max(rowH[z.r], z.h); });
  rowH.forEach((v, i) => { rowY[i] = i ? rowY[i - 1] + rowH[i - 1] + ROWGAP : PAD; });
  const pos = {};
  zs.forEach(z => {
    z.x = PAD + z.c * (ZW + COLGAP); z.y = rowY[z.r];
    z.members.forEach((m, i) => { pos[m.id] = { x: z.x + ZP, y: z.y + ZH + i * (NH + GAP) }; });
  });
  return { zs, pos, ncols, w: PAD + ncols * ZW + (ncols - 1) * COLGAP + RIGHT, h: rowY[rows - 1] + rowH[rows - 1] + PAD };
}

function edgePath(a, b) {
  const ax = a.x + NW / 2, ay = a.y + NH / 2, bx = b.x + NW / 2, by = b.y + NH / 2, dx = bx - ax;
  if (Math.abs(dx) < NW / 2) {
    const bulge = 14 + Math.min(26, Math.abs(by - ay) / 15), x1 = a.x + NW, x2 = b.x + NW;
    return `M${x1} ${ay} C${x1 + bulge} ${ay} ${x2 + bulge} ${by} ${x2} ${by}`;
  }
  const dir = dx > 0 ? 1 : -1, x1 = dir > 0 ? a.x + NW : a.x, x2 = dir > 0 ? b.x : b.x + NW, k = Math.max(40, Math.abs(x2 - x1) / 2);
  return `M${x1} ${ay} C${x1 + dir * k} ${ay} ${x2 - dir * k} ${by} ${x2} ${by}`;
}

function marker(id, cls) {
  const m = el("marker", { id, class: cls, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" });
  m.append(el("path", { d: "M0 0L10 5L0 10z" })); return m;
}

function render() {
  const box = $("graph"), L = layout(box.clientWidth || 800), { zs, pos } = L;
  const svg = el("svg", { class: "map" + (L.ncols === 1 ? " narrow" : ""), viewBox: `0 0 ${L.w} ${L.h}`, role: "group", "aria-label": "Component map", style: `max-width:${Math.max(L.w, 360)}px` });
  const defs = el("defs"); defs.append(marker("arr", ""), marker("arr-on", "on")); svg.append(defs);
  zs.forEach(z => {
    const g = el("g", { class: "zone" + (z.external ? " external" : ""), style: `--zc:var(--z-${z.id})`, role: "group", "aria-label": `${z.title}: ${z.blurb}` });
    g.append(el("rect", { class: "bg", x: z.x, y: z.y, width: z.w, height: z.h, rx: 14 }), el("circle", { class: "badge", cx: z.x + 22, cy: z.y + 22, r: 12 }), el("text", { class: "glyph", x: z.x + 22, y: z.y + 22 }, z.glyph), el("text", { class: "ztitle", x: z.x + 42, y: z.y + 26 }, z.title));
    wrap(z.blurb, 33).forEach((l, i) => g.append(el("text", { class: "zblurb", x: z.x + 14, y: z.y + 46 + i * 12 }, l)));
    svg.append(g);
  });
  svg._edges = data.edges.map(e => {
    const p = el("path", { class: "edge " + e.kind, d: edgePath(pos[e.from], pos[e.to]), "marker-end": "url(#arr)" });
    p.dataset.from = e.from; p.dataset.to = e.to; svg.append(p); return p;
  });
  zs.forEach(z => z.members.forEach(c => {
    const g = el("g", { class: "node", tabindex: 0, role: "button", "data-id": c.id, style: `--zc:var(--z-${c.zone})`, "aria-label": `${c.title} (${c.name}), ${z.title}. ${c.summary}`, transform: `translate(${pos[c.id].x} ${pos[c.id].y})` });
    const tl = wrap(c.title, 21), ty = tl.length === 1 ? 24 : 20;
    g.append(el("rect", { class: "card", width: NW, height: NH, rx: 10 }), el("circle", { class: "nbadge", cx: 19, cy: NH / 2, r: 11 }), el("text", { class: "nglyph", x: 19, y: NH / 2 }, z.glyph));
    tl.forEach((l, i) => g.append(el("text", { class: "ntitle", x: 38, y: ty + i * 13 }, l)));
    g.append(el("text", { class: "nname", x: 38, y: ty + tl.length * 13 + 3 }, c.name));
    g.addEventListener("click", () => select(c.id));
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(c.id); } else if (ev.key === "Escape") clearSel(); });
    for (const [ev, v] of [["mouseenter", c.id], ["focus", c.id], ["mouseleave", null], ["blur", null]]) g.addEventListener(ev, () => { hover = v; mark(); });
    svg.append(g);
  }));
  box.replaceChildren(svg);
  mark();
}

function mark() {
  const svg = document.querySelector("#graph svg"); if (!svg) return;
  const step = tour != null ? data.flow[tour] : null, a = hover || selected, c = a && byId[a];
  let rel = null, on = () => false;
  if (step) { rel = new Set(step.components); on = e => rel.has(e.from) && rel.has(e.to); }
  else if (c) { rel = new Set([c.id, ...c.dependsOn, ...c.usedBy]); on = e => e.from === c.id || e.to === c.id; }
  svg.querySelectorAll(".node").forEach(n => { const id = n.dataset.id; n.classList.toggle("sel", id === selected); n.classList.toggle("dim", !!rel && !rel.has(id)); n.setAttribute("aria-pressed", id === selected); });
  svg._edges.forEach(p => {
    const e = { from: p.dataset.from, to: p.dataset.to }, o = on(e);
    p.classList.toggle("on", o); p.classList.toggle("dim", !!rel && !o); p.setAttribute("marker-end", o ? "url(#arr-on)" : "url(#arr)");
  });
}

function list(title, ids) {
  const s = document.createDocumentFragment();
  if (!ids.length) return s;
  s.append(h("h3", {}, title));
  const ul = h("ul");
  ids.forEach(i => { const li = h("li"), b = h("button", { class: "chip" }, byId[i].title); b.onclick = () => select(i); li.append(b); ul.append(li); });
  s.append(ul); return s;
}

function select(id) {
  selected = id; const c = byId[id], p = $("panel"), z = zoneOf[c.zone];
  const tags = h("p");
  [z.title, c.group, c.kind, ...c.profiles.map(x => "profile " + x), ...(c.image ? [c.image] : [])].forEach(t => tags.append(h("span", { class: "tag" }, t)));
  const links = h("ul");
  c.links.forEach(l => { const li = h("li"), a = h("a", { href: l.url, target: "_blank", rel: "noopener" }, l.label); li.append(a); links.append(li); });
  const tech = h("details"); tech.append(h("summary", {}, "Technical details"), tags, h("p", {}, c.description), h("h3", {}, "Docs and sources"), links);
  const close = h("button", { class: "close", "aria-label": "Close details" }, "×"); close.onclick = clearSel;
  p.replaceChildren(close, h("h2", {}, c.title), h("code", {}, c.name), h("p", { class: "sum" }, c.summary), h("p", {}, c.details), h("h3", {}, "How it fits in the flow"), h("p", {}, c.flow), list("Talks to / needs", c.dependsOn), list("Used by", c.usedBy), tech);
  p.classList.add("has"); document.body.classList.add("sheet");
  history.replaceState(null, "", "#" + id);
  mark();
}

function clearSel() {
  selected = null; $("panel").classList.remove("has"); document.body.classList.remove("sheet");
  $("panel").replaceChildren(h("p", {}, "No component selected. Click a card to see what it is, why it exists and how it fits in the flow."));
  history.replaceState(null, "", location.pathname + location.search); mark();
}

function setTour(i) {
  tour = i;
  document.querySelectorAll("#tour .step").forEach((b, k) => { if (k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
  $("prev").disabled = i == null || i === 0; $("next").disabled = i === data.flow.length - 1;
  const t = $("tourtext");
  if (i == null) t.textContent = "Pick a step to follow the data through the system, or click a component to learn what it does.";
  else { const s = data.flow[i]; t.replaceChildren(h("b", {}, `Step ${i + 1} of ${data.flow.length}: ${s.title}. `), document.createTextNode(s.text)); }
  mark();
}

function init() {
  $("h1").textContent = data.intro.title;
  data.intro.paragraphs.forEach(t => $("intro").append(h("p", {}, t)));
  const tr = $("tour");
  tr.append(Object.assign(h("button", { class: "nav", id: "prev" }, "← Previous"), { onclick: () => setTour(Math.max(0, (tour ?? 1) - 1)) }));
  data.flow.forEach((s, i) => { if (i) tr.append(h("span", { class: "sep", "aria-hidden": "true" }, "→")); tr.append(Object.assign(h("button", { class: "step" }, `${i + 1}. ${s.title}`), { onclick: () => setTour(tour === i ? null : i) })); });
  tr.append(Object.assign(h("button", { class: "nav", id: "next" }, "Next →"), { onclick: () => setTour(tour == null ? 0 : tour + 1) }));
  setTour(null);
  data.glossary.forEach(g => { const d = h("div"); d.append(h("dt", {}, g.term), h("dd", {}, g.text)); $("gloss").append(d); });
}

fetch("components.json").then(r => r.json()).then(d => {
  data = d; byId = Object.fromEntries(d.components.map(c => [c.id, c])); zoneOf = Object.fromEntries(d.zones.map(z => [z.id, z]));
  const id = decodeURIComponent(location.hash.slice(1));
  init(); clearSel(); render(); let w = $("graph").clientWidth;
  addEventListener("resize", () => { const n = $("graph").clientWidth; if (n !== w) { w = n; render(); } });
  addEventListener("keydown", e => { if (e.key === "Escape" && tour != null) setTour(null); });
  if (byId[id]) select(id);
}).catch(e => { $("graph").textContent = "Could not load components.json: " + e; });
</script>
</body>
</html>
