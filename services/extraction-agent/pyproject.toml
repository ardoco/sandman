[project]
name = "sandman-extraction-agent"
version = "0.1.0"
description = "Information extraction agent."
requires-python = ">=3.13,<3.14"
dependencies = ["sandman-agent"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandman_extraction"

[tool.uv.sources]
sandman-agent = { workspace = true }
