[project]
name = "sandman-llm-replay"
version = "0.1.0"
description = "OpenAI-compatible record/replay proxy (standalone)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "rfc8785==0.1.4",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandman_llm_replay"
