name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/**'
              - '.github/workflows/**'
            python:
              - 'contracts/**'
              - 'libs/python/**'
              - 'services/orchestrator/**'
              - 'services/extraction-agent/**'
              - 'services/query-service/**'
              - 'services/llm-replay/**'
              - 'tools/**'
              - 'tests/plugin-stubs/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            java:
              - 'contracts/**'
              - 'libs/java/**'
              - 'services/tlr-agent/**'
              - 'services/inconsistency-agent/**'
              - 'pom.xml'
              - '.github/workflows/**'
            compose:
              - 'deploy/**'
              - 'services/**'
              - '.github/workflows/**'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/validate_contracts.py

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: make lint
      - run: uv run pytest

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config with generated secrets
        run: |
          tmp=$(mktemp -d)
          cp -R deploy "$tmp/deploy"
          cd "$tmp/deploy"
          ./gen-secrets.sh > /dev/null
          for profiles in "" "--profile stubs --profile obs --profile local-llm"; do
            docker compose $profiles config -q
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
