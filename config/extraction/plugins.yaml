# Extraction plugins and explicit-reference patterns (Stage 2 §1.6).
plugins:
  - id: code-extractor
    transport: a2a                        # a2a | http (extraction-agent implements a2a only until needed)
    url: http://plugin-stubs:8000          # a2a: Agent Card at /.well-known/agent-card.json
    skill: sandman.plugin.extract
    tokenFile: /run/secrets/plugin_in_plugin-stubs   # inbound token of the plugin
    match: { kinds: [code, test] }        # or formats / globs
    timeout: 10m
explicitReferences:
  patterns: ['REQ-\d+', 'FR-\d+']
builtin:
  enabled: true                           # false restores the M0 file-level stub extraction
                                          # (like an extractor fallback: file-level elements only, no Requirement nodes - intended)
  converter:                              # PDF/DOCX via the document-converter service (Docling, no OCR); failure -> file-level element
    timeoutSeconds: 600                   # HTTP timeout including queueing; the conversion limits are the converter's (SANDMAN_CONVERTER_*)
