<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}SANDMAN{% endblock %}</title>
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
<link rel="stylesheet" href="/static/console.css">
{% block head %}{% endblock %}
<script src="/static/htmx.min.js"></script>
</head>
<body hx-boost="true">
<header>
  <strong>SANDMAN</strong>
  {% if user %}
  <nav>
  <a href="/console/projects">Projects</a>
  <a href="/console/tokens">Tokens</a>
  {% if is_admin %}<a href="/console/admin">Administration</a>{% endif %}
  </nav>
  <form method="post" action="/console/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><span>{{ user }}</span> <button>Log out</button></form>
  {% endif %}
</header>
<main>
{% if message %}<div class="msg {% if error %}error{% endif %}">{{ message }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
