# Detectors and detector plugins (Stage 2 §1.6). Plugins: plain HTTP only (a2a is rejected at startup).
detectors:
  stub-untraced: { enabled: true }
  ardoco-id: { enabled: true, params: { textKinds: [architecture-doc], modelKinds: [architecture-model], linkApproaches: all } }   # T3.1
  artemis-id: { enabled: false, params: { textKinds: [architecture-doc], modelKinds: [architecture-model] } }   # T3.2, LLM via gateway
  model-code: { enabled: true, params: { modelKinds: [architecture-model], codeKinds: [code], linkApproaches: all } }   # T7.3
plugins:
  - id: detect-stub
    transport: http                       # POST /v1/detect, GET /manifest
    url: http://plugin-stubs:8001
    tokenFile: /run/secrets/plugin_in_plugin-stubs   # inbound token of the plugin
    timeout: 10m
