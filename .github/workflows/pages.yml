name: pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "contracts/**"
      - "services/**"
      - "libs/**"
      - "docs/**"
      - "adr/**"
      - "site/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/build_site.py site/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
