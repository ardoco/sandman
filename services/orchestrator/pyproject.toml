[project]
name = "sandman-orchestrator"
version = "0.1.0"
description = "Rule-based orchestrator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2",
    "rfc8785>=0.1.4",
    "sandman-agent",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandman_orchestrator"

[tool.uv.sources]
sandman-agent = { workspace = true }
