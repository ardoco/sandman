# Query strategies of POST /v1/query/nl (ADR-0018; schema: contracts/config/query-strategies.schema.json).
# A disabled or not yet implemented strategy answers 501. `auto` considers enabled strategies only.
classifierThreshold: 0.6
strategies:
  cypher:
    enabled: true
    intentsFirst: true   # regex intents (intents.yaml) answer before the LLM is asked
    maxRepairs: 2
    maxExamples: 8
  graphrag:
    enabled: false       # needs element embeddings (config/extraction/embedding.yaml, T4.1b); without them the strategy answers 409
    topK: 5              # seed elements of the vector search
    overFetch: 20        # search asks for topK * overFetch hits, because the projectId filter runs after the search
    maxNeighbours: 5     # neighbours and trace-link partners per seed
    dimension: 768       # = vector index element_embedding
  explore:
    enabled: false
